---
layout: search
page_title: Search
permalink: /search/
---

<script>
  $(document).ready(function () {
    var urlParams = new URLSearchParams(window.location.search);
    var query = urlParams.get('q');
    if (query) {
      // 입력창에 값만 먼저 채워둠
      $('#search-input').val(query);
    }
  });
</script>

<div class="container">
  <div class="row">
    <div class="col-12">
      <div id="search-bar">
        <i class="fa fa-search" aria-hidden="true"></i>
        <input id="search-input" type="text" placeholder="검색어를 입력하세요." />
      </div>
      <ul id="results-container"></ul>
    </div>
  </div>
</div>

<!-- Script pointing to jekyll-search.js -->
<script src="/assets/js/simple-jekyll-search.js" type="text/javascript"></script>

<script type="text/javascript">
  SimpleJekyllSearch({
    searchInput: document.getElementById('search-input'),
    resultsContainer: document.getElementById('results-container'),
    json: '/search.json',
    searchResultTemplate: '<li><a href="{url}" title="{desc}" target="_blank">{title}</a></li>',
    noResultsText: '검색결과가 존재하지 않습니다.',
    limit: 10000,
    fuzzy: false,
    exclude: ['Welcome'],
    success: function() {
      // 데이터 로드가 비동기이므로, 약간의 지연 후에 검색을 실행하여 데이터가 준비되도록 함
      var self = this;
      var urlParams = new URLSearchParams(window.location.search);
      var query = urlParams.get('q');
      if (query) {
        setTimeout(function() {
          self.search(query);
        }, 100); // 0.1초 지연
      }
    }
  });
</script>
